<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - ブログ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="card">
        <h1>ログイン</h1>
        <p class="success" th:if="${param.registered != null}">登録が完了しました。ログインしてください。</p>
        <p class="error" th:if="${param.error != null}">ユーザー名またはパスワードが正しくありません。</p>
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="ユーザー名" required autofocus>
            <input type="password" name="password" placeholder="パスワード" required>
            <button type="submit">ログイン</button>
        </form>
        <p>アカウントをお持ちでない方は <a th:href="@{/register}">新規登録</a></p>
    </div>
</div>
</body>
</html>
